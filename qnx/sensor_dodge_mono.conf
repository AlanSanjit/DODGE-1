# DODGE-1 sensor service configuration: ONE USB (UVC) webcam (mono mode, config.CAMERA_MODE = "mono").
# With a single USB camera the address may use wildcards (QNX docs: four -1 values), so it works in
# either blue USB port. Start with:  sudo sh qnx/start_cameras.sh qnx/sensor_dodge_mono.conf

begin SENSOR_UNIT_1
    type = usb_camera
    name = mono
    position = 0, 0, 0
    direction = 0, 0, 1
    address = /dev/usb/io-usb-otg, -1, -1, -1, -1
    default_video_format = ycbycr
    default_video_resolution = 640, 480
    default_video_framerate = 30
end SENSOR_UNIT_1
