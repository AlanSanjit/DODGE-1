# DODGE-1 sensor service configuration: two USB (UVC) webcams as a stereo pair.
#
# With more than one USB camera QNX needs the bus and device of each camera in `address`
# (driver_path, bus, device, vendorID, deviceID; -1 = any). Run `usb -vvv` on the Pi:
#   "Upstream Host Controller" -> bus      "Device Address" -> device
# Replace LEFT_BUS/LEFT_DEV/RIGHT_BUS/RIGHT_DEV below (plain numbers), then run qnx/start_cameras.sh.
# Plug the cameras into the two BLUE (USB 3.0) ports: they are on separate controllers, so
# two uncompressed 640x480 streams do not share one USB 2.0 bus.
#
# LEFT camera = the one on the left when you stand BEHIND the cameras looking where they look.
# Sensor unit 1 = left, sensor unit 2 = right (perception opens them in that order).

begin SENSOR_UNIT_1
    type = usb_camera
    name = left
    position = 0, 0, 0
    direction = 0, 0, 1
    address = /dev/usb/io-usb-otg, 0, 2, -1, -1
    default_video_format = ycbycr
    default_video_resolution = 640, 480
    default_video_framerate = 30
end SENSOR_UNIT_1

begin SENSOR_UNIT_2
    type = usb_camera
    name = right
    position = 0, 0, 0
    direction = 0, 0, 1
    address = /dev/usb/io-usb-otg, 1, 2, -1, -1
    default_video_format = ycbycr
    default_video_resolution = 640, 480
    default_video_framerate = 30
end SENSOR_UNIT_2
